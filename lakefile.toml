name = "eip8200-challenges"
version = "0.1.0"
defaultTargets = ["Challenge"]

# The verified Yul→EVM compiler. Submissions written in Yul are compiled by
# *this* compiler, so a Yul-level proof lands on the bytecode with no
# bytecode-level reasoning (see Challenge/Sha256/ProofSupport/Yul.lean). It also
# brings in the two semantics it is proved against.
#
# The pinned compiler contains both verified backends and exposes an explicit
# classic selector. Repository-owned source compilation uses that selector to
# preserve all four frozen artifacts byte-for-byte; the compiler's automatic
# policy remains available to other callers.
[[require]]
name = "yul-evm-compiler"
git = "https://github.com/powdr-labs/yul-compiler"
rev = "c2e44cd2d487fd59b14897732189acc0c1724873"

# Pin the source semantics explicitly because it is part of the proof and
# submission trust boundary, rather than relying on the compiler transitively.
[[require]]
name = "yul-semantics"
git = "https://github.com/powdr-labs/yul-semantics"
rev = "c9914c13df47efe026376723acd632bc33bc16e3"

# The EVM semantics. This is where the *specification* lives: a challenge is
# equality with `EvmSemantics.Crypto.Sha256.hash`, the function
# `Precompile.runSha256` computes for the 0x02 precompile. Required explicitly
# (rather than relied on transitively) because the pin is part of the trust
# boundary a submission is judged against. The compiler and its target-semantics
# proofs are built against this resolved Lean-4.33 revision in CI.
[[require]]
name = "evm_semantics"
git = "https://github.com/powdr-labs/evm-semantics"
rev = "2f8714d6ba960a3de67720019b54513f5bc1a2e3"

# Keep the inherited dependency graph on the same release as this project's
# Lean toolchain.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Challenge"

# CI-only axiom-footprint guards. Kept out of the default targets and in a
# separate library so each challenge's checks can be built independently.
[[lean_lib]]
name = "Checks"

# The Tier-1 scorer: runs a candidate implementation (Yul source or raw
# bytecode) in the pinned executable EVM semantics over the FIPS and
# padding-boundary vectors, and reports gas. Built natively rather than run
# with `lake env lean`: compiling real Yul recurses deeper than the
# interpreter's stack allows, and the scored runs are millions of steps.
[[lean_exe]]
name = "sha256challenge"
root = "Sha256Main"

[[lean_exe]]
name = "modexpchallenge"
root = "ModexpMain"

[[lean_exe]]
name = "ripemd160challenge"
root = "Ripemd160Main"

[[lean_exe]]
name = "blake2fchallenge"
root = "Blake2fMain"
