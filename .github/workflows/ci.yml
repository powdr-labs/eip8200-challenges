name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submission-policy-test:
    name: Submission boundary policy self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Exercise acceptance and rejection controls
        run: scripts/check-submission-boundary.sh --self-test

  # Build external Lean dependencies and the direct-EVM proof layer once.
  # Challenge jobs restore these complete global caches and own only their
  # root-package outputs.
  shared-lean:
    name: Shared Lean proof infrastructure
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 30
    outputs:
      package-key: ${{ steps.cache-keys.outputs.package-key }}
      shared-key: ${{ steps.cache-keys.outputs.shared-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute shared cache keys
        id: cache-keys
        env:
          DEPENDENCY_HASH: ${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          PACKAGE_TARGET_HASH: ${{ hashFiles('.github/lean-package-cache-targets') }}
          SHARED_ARTIFACT_HASH: ${{ hashFiles('Challenge/Bls12381/Reference/Artifacts/*.hex') }}
          SHARED_SOURCE_HASH: ${{ hashFiles('lakefile.toml', 'Challenge/EvmProof.lean', 'Challenge/EvmProof/**/*.lean', 'Checks/EvmProof.lean', 'Challenge/Bls12381.lean', 'Challenge/Bls12381/**/*.lean', 'Checks/Bls12381*.lean', '!Checks/Bls12381Codec.lean', '!Checks/Bls12381Fp.lean', '!Checks/Bls12381Fp2.lean', '!Checks/Bls12381Fp6.lean', '!Checks/Bls12381Fp12.lean', '!Checks/Bls12381G1Add*.lean', '!Checks/Bls12381G1Msm.lean', '!Checks/Bls12381G1Projective.lean', '!Checks/Bls12381G2Add*.lean', '!Checks/Bls12381G2Msm.lean', '!Checks/Bls12381G2Projective.lean', '!Checks/Bls12381MapFp*.lean', '!Checks/Bls12381Pairing.lean', '!Checks/Bls12381PrimeCertificate.lean', '!Checks/Bls12381PrimeField.lean', '!Checks/Bls12381Conformance.lean', '!Checks/Bls12381ReferenceBaseline.lean') }}
        run: |
          package_key="lake-packages-v4-${{ runner.os }}-${{ runner.arch }}-${DEPENDENCY_HASH}-${PACKAGE_TARGET_HASH}"
          shared_prefix="project-shared-v4-${{ runner.os }}-${{ runner.arch }}-${DEPENDENCY_HASH}-${PACKAGE_TARGET_HASH}-${SHARED_ARTIFACT_HASH}"
          shared_key="${shared_prefix}-${SHARED_SOURCE_HASH}"
          echo "package-key=$package_key" >> "$GITHUB_OUTPUT"
          echo "shared-key=$shared_key" >> "$GITHUB_OUTPUT"
          echo "shared-restore-prefix=${shared_prefix}-" >> "$GITHUB_OUTPUT"

      # This cache is the sole owner of dependency-package sources and build
      # outputs. Its target-set hash forces a new immutable cache whenever the
      # globally warmed dependency closure changes.
      - name: Cache pinned packages
        id: package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: ${{ steps.cache-keys.outputs.package-key }}
          restore-keys: |
            lake-packages-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-packages-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
            lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Cache shared project build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ${{ steps.cache-keys.outputs.shared-key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.shared-restore-prefix }}

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          # `cache-hit` is empty only for a total miss; it is `false` for a
          # restore-prefix hit whose complete workspace already has Mathlib.
          use-mathlib-cache: ${{ steps.package-cache.outputs.cache-hit == '' }}
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Build global package dependencies
        run: |
          mapfile -t targets < .github/lean-package-cache-targets
          lake build "${targets[@]}"

      - name: Build shared EVM proof support
        run: lake build +Challenge.EvmProof:c.o

      - name: Verify shared soundness
        run: |
          if grep -rn --include='*.lean' -w 'sorry' Challenge/EvmProof Challenge/EvmProof.lean; then
            echo "::error::found an unfinished proof in shared EVM support"
            exit 1
          fi
          lake build +Checks.EvmProof

      - name: Verify shared BLS12-381 proof support
        run: |
          if grep -rn --include='*.lean' -w 'sorry' \
              Challenge/Bls12381/ProofSupport \
              Challenge/Bls12381/ProofSupport.lean; then
            echo "::error::found an unfinished proof in shared BLS12-381 support"
            exit 1
          fi
          lake -Kjobs=1 build +Checks.Bls12381

  # G1ADD is intentionally not part of the shared BLS cache: its source,
  # compiler, bytecode, and execution certificates are challenge-owned.  Keep
  # a dedicated gate so every focused axiom guard is enforced in standard CI.
  bls12381-g1add:
    name: BLS12-381 G1ADD proofs and frozen artifact
    needs: shared-lean
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore pinned packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ needs.shared-lean.outputs.package-key }}
          fail-on-cache-miss: true

      - name: Restore shared project build
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ needs.shared-lean.outputs.shared-key }}
          fail-on-cache-miss: true

      # `reference.yul` and `reference.hex` are consumed through parser and
      # `include_str` boundaries that Lake does not reliably trace.  Put their
      # hash before the Lean-source hash, including in the restore namespace,
      # so an artifact change cannot restore stale challenge oleans.
      - name: Compute G1ADD cache keys
        id: g1add-cache-keys
        env:
          ARTIFACT_HASH: ${{ hashFiles('Challenge/Bls12381G1Add/Reference/reference.yul', 'Challenge/Bls12381G1Add/Reference/reference.hex') }}
          LEAN_HASH: ${{ hashFiles('Challenge/Bls12381G1Add.lean', 'Challenge/Bls12381G1Add/**/*.lean', 'Checks/Bls12381G1Add*.lean') }}
        run: |
          prefix="project-bls12381-g1add-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-${ARTIFACT_HASH}"
          echo "key=${prefix}-${LEAN_HASH}" >> "$GITHUB_OUTPUT"
          echo "restore-prefix=${prefix}-" >> "$GITHUB_OUTPUT"

      - name: Cache G1ADD project build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ${{ steps.g1add-cache-keys.outputs.key }}
          restore-keys: |
            ${{ steps.g1add-cache-keys.outputs.restore-prefix }}

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Verify G1ADD soundness
        run: |
          scripts/test-check-lean-proof-policy.sh
          python3 scripts/check-lean-proof-policy.py \
            Challenge/Bls12381G1Add Challenge/Bls12381G1Add.lean \
            Checks/Bls12381G1Add*.lean

      - name: Build every G1ADD proof and axiom guard
        run: |
          # These decision units peak near 5 GiB each. Build them in separate
          # Lake invocations so a 16 GiB runner never overlaps their peaks.
          lake -Kjobs=1 build Challenge.Bls12381G1Add.Reference.Proofs.StackCertificateChunk0
          lake -Kjobs=1 build Challenge.Bls12381G1Add.Reference.Proofs.StackCertificateChunk5
          mapfile -t checks < <(
            find Checks -maxdepth 1 -type f -name 'Bls12381G1Add*.lean' \
              -printf '%f\n' | sort | \
              sed -e 's/\.lean$//' -e 's/^/+Checks./'
          )
          lake -Kjobs=1 build +Challenge.Bls12381G1Add:c.o "${checks[@]}"

      - name: Verify frozen G1ADD source artifact
        run: |
          reference=Challenge/Bls12381G1Add/Reference
          compiled="$(lake exe yulc "$reference/reference.yul")"
          frozen="$(tr -d '[:space:]' < "$reference/reference.hex")"
          if [ "$compiled" != "$frozen" ]; then
            echo "::error::G1ADD reference.hex is stale"
            exit 1
          fi

  # G2ADD uses a proof-friendly direct compiler boundary.  The ordinary Yul
  # optimizer emits a different 3,339-byte program, so freshness is checked by
  # the executable Lean guard for the proved 2,788-byte runtime below.
  bls12381-g2add:
    name: BLS12-381 G2ADD proofs and frozen direct artifact
    needs: shared-lean
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore pinned packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ needs.shared-lean.outputs.package-key }}
          fail-on-cache-miss: true

      - name: Restore shared project build
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ needs.shared-lean.outputs.shared-key }}
          fail-on-cache-miss: true

      # Lake does not reliably track `include_str` inputs.  Keep the source,
      # frozen hex, and proved byte-list representation ahead of the Lean hash
      # in both the exact key and restore namespace.
      - name: Compute G2ADD cache keys
        id: g2add-cache-keys
        env:
          ARTIFACT_HASH: ${{ hashFiles('Challenge/Bls12381G2Add/Reference/reference.yul', 'Challenge/Bls12381G2Add/Reference/reference.hex', 'Challenge/Bls12381G2Add/Reference/FrozenBytecode.lean') }}
          LEAN_HASH: ${{ hashFiles('Challenge/Bls12381G2Add.lean', 'Challenge/Bls12381G2Add/**/*.lean', 'Checks/Bls12381G2Add*.lean') }}
        run: |
          prefix="project-bls12381-g2add-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-${ARTIFACT_HASH}"
          echo "key=${prefix}-${LEAN_HASH}" >> "$GITHUB_OUTPUT"
          echo "restore-prefix=${prefix}-" >> "$GITHUB_OUTPUT"

      - name: Cache G2ADD project build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ${{ steps.g2add-cache-keys.outputs.key }}
          restore-keys: |
            ${{ steps.g2add-cache-keys.outputs.restore-prefix }}

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Verify G2ADD soundness
        run: |
          python3 scripts/test-bls-ci-cache-policy.py
          scripts/test-check-lean-proof-policy.sh
          python3 scripts/check-lean-proof-policy.py \
            Challenge/Bls12381G2Add Challenge/Bls12381G2Add.lean \
            Checks/Bls12381G2Add*.lean

      - name: Build every G2ADD proof and axiom guard
        run: |
          # These decision units peak near 5 GiB each. Build them in separate
          # Lake invocations so a 16 GiB runner never overlaps their peaks.
          lake -Kjobs=1 build Challenge.Bls12381G2Add.Reference.Proofs.StackCertificateChunk0
          lake -Kjobs=1 build Challenge.Bls12381G2Add.Reference.Proofs.StackCertificateChunk5
          lake -Kjobs=1 build Challenge.Bls12381G2Add.Reference.Proofs.StackCertificateChunk10
          mapfile -t checks < <(
            find Checks -maxdepth 1 -type f -name 'Bls12381G2Add*.lean' \
              -printf '%f\n' | sort | \
              sed -e 's/\.lean$//' -e 's/^/+Checks./'
          )
          lake -Kjobs=1 build +Challenge.Bls12381G2Add:c.o "${checks[@]}"

      - name: Verify exact 2,788-byte direct-compiler artifact
        run: |
          # This check evaluates `referenceBytecode?` directly and guards its
          # equality with both FrozenBytecode.lean and reference.hex.  Do not
          # replace it with yulc, whose optimized G2ADD artifact is 3,339 bytes.
          lake -Kjobs=1 env lean Checks/Bls12381G2AddReference.lean

  # Each matrix entry has its own job and source-keyed project cache. A RIPEMD
  # submission therefore neither rebuilds nor invalidates SHA-256 or MODEXP.
  challenge:
    name: ${{ matrix.name }} proofs, submissions, and gas
    needs: shared-lean
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SHA-256
            directory: Sha256
            slug: sha256
            executable: sha256challenge
            main: Sha256Main.lean
            target: +Challenge.Sha256 sha256challenge
            has_submission_checks: true
          - name: RIPEMD-160
            directory: Ripemd160
            slug: ripemd160
            executable: ripemd160challenge
            main: Ripemd160Main.lean
            target: +Challenge.Ripemd160 ripemd160challenge
            has_submission_checks: true
          - name: MODEXP
            directory: Modexp
            slug: modexp
            executable: modexpchallenge
            main: ModexpMain.lean
            target: +Challenge.Modexp modexpchallenge
            has_submission_checks: true
          - name: BLAKE2f
            directory: Blake2f
            slug: blake2f
            executable: blake2fchallenge
            main: Blake2fMain.lean
            target: +Challenge.Blake2f blake2fchallenge
            has_submission_checks: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore pinned packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ needs.shared-lean.outputs.package-key }}
          fail-on-cache-miss: true

      - name: Restore shared project build
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ needs.shared-lean.outputs.shared-key }}
          fail-on-cache-miss: true

      - name: Cache ${{ matrix.name }} project build
        uses: actions/cache@v5
        with:
          # Dependency-package artifacts come exclusively from the global
          # package cache. A challenge cache owns only root-package outputs.
          path: .lake/build
          # Only compiled Lean inputs belong in this hash. Documentation and
          # generated gas reports are checked separately and must not trigger
          # a cold proof rebuild.
          key: project-${{ matrix.slug }}-v4-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-${{ hashFiles(format('Challenge/{0}.lean', matrix.directory), format('Challenge/{0}/**/*.lean', matrix.directory), matrix.main, format('Checks/{0}.lean', matrix.directory)) }}
          # Prefer root-only v4 caches. Older namespaces can bootstrap root
          # outputs when their cache archive version is compatible.
          restore-keys: |
            project-${{ matrix.slug }}-v4-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-
            project-${{ matrix.slug }}-v3-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-
            project-${{ matrix.slug }}-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-
            project-${{ matrix.slug }}-v1-${{ runner.os }}-${{ runner.arch }}-
            project-lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Build ${{ matrix.name }} proofs and scorer
        run: lake build ${{ matrix.target }}

      # A proof is only a proof if its axiom footprint is the standard one.
      # The textual scan catches an unfinished proof that an umbrella misses.
      - name: Verify ${{ matrix.name }} soundness
        run: |
          if grep -rn --include='*.lean' -w 'sorry' \
              "Challenge/${{ matrix.directory }}" \
              "Challenge/${{ matrix.directory }}.lean" \
              "${{ matrix.main }}"; then
            echo "::error::found an unfinished ${{ matrix.name }} proof"
            exit 1
          fi
          lake build "+Checks.${{ matrix.directory }}"

      # Keep each statement auditable in isolation. Proof support and bundled
      # implementations may depend on the spec, never the reverse.
      - name: Verify ${{ matrix.name }} specification boundary
        run: |
          imports="$(grep '^import ' "Challenge/${{ matrix.directory }}/Spec.lean")"
          if [ "$imports" != 'import EvmSemantics.EVM.BigStep' ]; then
            echo "::error::${{ matrix.name }} Spec.lean must depend only on the pinned EVM semantics"
            printf '%s\n' "$imports"
            exit 1
          fi

      # The Yul compiler is only the reproducible generator for the frozen
      # artifact; direct-bytecode proofs target the literal bytes themselves.
      - name: Verify frozen ${{ matrix.name }} reference bytecode
        run: |
          reference="Challenge/${{ matrix.directory }}/Reference"
          compiled="$(lake exe yulc "$reference/reference.yul")"
          frozen="$(tr -d '[:space:]' < "$reference/reference.hex")"
          literal="$(lake exe ${{ matrix.executable }} --print-reference-hex)"
          if [ "$compiled" != "$frozen" ] || [ "$literal" != "$frozen" ]; then
            echo "::error::${{ matrix.name }} reference.hex is stale"
            exit 1
          fi

      # Candidate PRs follow a fixed module/declaration convention. These
      # checks validate theorem type, bytecode identity, transitive axioms,
      # executable vectors, and optional proved gas schedules.
      - name: Verify ${{ matrix.name }} submissions and gas report
        if: matrix.has_submission_checks
        run: |
          scripts/check-${{ matrix.slug }}-submissions.sh --self-test
          scripts/check-${{ matrix.slug }}-submissions.sh
          scripts/report-${{ matrix.slug }}-gas.sh --self-test
          scripts/check-${{ matrix.slug }}-gas-report.sh

      - name: Run ${{ matrix.name }} scorer controls
        run: |
          case "${{ matrix.slug }}" in
            sha256)
              printf '60206000f3' > /tmp/sha256-zeros.hex
              if lake exe sha256challenge --hex=/tmp/sha256-zeros.hex; then
                echo "::error::the SHA-256 scorer accepted a candidate returning 32 zero bytes"
                exit 1
              fi
              ;;
            ripemd160)
              lake exe ripemd160challenge --hex=Challenge/Ripemd160/Reference/reference.hex
              printf '60206000f3' > /tmp/ripemd160-zeros.hex
              if lake exe ripemd160challenge --hex=/tmp/ripemd160-zeros.hex; then
                echo "::error::the RIPEMD-160 scorer accepted a candidate returning 32 zero bytes"
                exit 1
              fi
              ;;
            modexp)
              lake exe modexpchallenge
              ;;
            blake2f)
              lake exe blake2fchallenge --hex=Challenge/Blake2f/Reference/reference.hex
              printf '60406000f3' > /tmp/blake2f-zeros.hex
              if lake exe blake2fchallenge --hex=/tmp/blake2f-zeros.hex; then
                echo "::error::the BLAKE2f scorer accepted a candidate returning 64 zero bytes"
                exit 1
              fi
              ;;
          esac

  # Independent gas re-measurement under revm. This deliberately shares no
  # Lean code with the proof jobs, so disagreement between the EVMs is visible.
  crosscheck:
    name: Cross-check published gas under revm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lib/forge-std and the pinned eth-act/evmification implementations.
          # Not recursive: evmification's own libraries are not imported here.
          submodules: true

      # Pinned rather than floating: exact gas equality is reproducible only
      # against a fixed revm, so a toolchain bump remains a deliberate change.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check

      - name: Cross-check reference gas against the published numbers
        run: forge test -vv
